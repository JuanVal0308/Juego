      <path id="vibracion-icono-onda-izq-2" d="M37.44 306.8 L34.08 314 L37.44 321.2" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path id="vibracion-icono-onda-der-1" d="M55.2 309.2 L57.6 314 L55.2 318.8" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
