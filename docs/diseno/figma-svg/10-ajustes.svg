      <path id="sonido-icono-onda-1" d="M52.49 143.96 L53.29 144.79 L53.89 145.77 L54.25 146.86 L54.38 148 L54.25 149.14 L53.89 150.23 L53.29 151.21 L52.49 152.04" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
